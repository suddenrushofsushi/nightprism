name: Nightprism
options:
  bundleIdPrefix: com.cwaterman
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    # Local-dev signing. Switch to "Apple Development" / a team ID before distributing.

targets:
  Nightprism:
    type: application
    platform: macOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
        optional: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Nightprism
        CFBundleDisplayName: Nightprism
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true   # Menubar-only app; no Dock icon, no main menu hijack.
        NSHumanReadableCopyright: "© 2026 Craig Waterman"
        NSHighResolutionCapable: true
        NSScreenCaptureUsageDescription: "Nightprism uses window information to attach dimming overlays to the windows you choose. This prototype does not record or save screen images."
    entitlements:
      path: Resources/Nightprism.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cwaterman.Nightprism
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        METAL_LANGUAGE_REVISION: UseDeploymentTarget

  NightprismTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Nightprism
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Nightprism:
    build:
      targets:
        Nightprism: all
    test:
      targets:
        - NightprismTests
      gatherCoverageData: true
